repository:
  name: "engineering-standards"
  description: "Standards and governance models for portfolio repository alignment."
  owner: "Portfolio Engineering"
  contact: "engineering@portfolio.local"

compliance:
  license: "MIT"
  license_file: "LICENSE"
  security_scans: true
  dependency_alerts: true

architecture:
  pattern: "Operational Standards Repository"
  runtime: "Python 3.10"
  framework: "None"
  database: "None"

observability:
  framework: "None"
  collector_endpoint: "None"
  logs:
    format: "None"
    sink: "None"

repository_type: "operational-governance-platform"

capabilities:
  telemetry:
    structured_logs: false
    metrics: false
    executive_summary: true

  governance:
    schema_validation: true
    markdownlint: true
    taxonomy_enforcement: true

  ai_workflows:
    reusable_prompts: true
    deterministic_reviews: true

maturity:
  level: "portfolio-grade"
